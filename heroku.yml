build:
  config:
    USE_CPU_TORCH: "true"
  docker:
    # web server container
    web: server/Dockerfile
    # math worker container
    worker: math/Dockerfile
    # self-managed PostgreSQL theme analysis worker
    # Build the production stage explicitly. The Dockerfile's trailing `test`
    # stage is intentionally available to local/CI builds but is not a runtime
    # image and includes development-only dependencies.
    delphi:
      dockerfile: delphi/Dockerfile
      target: final
release:
  image: web
  command:
    - node bin/run-theme-migration.js
run:
  web:
    image: web
    command:
      - env DELPHI_DYNAMODB_ENABLED=false npm run serve
  worker:
    image: worker
    command:
      - ./bin/run
  delphi:
    image: delphi
    command:
      - env DELPHI_THEME_EMBEDDING_MODE=tfidf python scripts/start_workers.py --postgres-only
